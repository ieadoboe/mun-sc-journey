    <h1>Raw svg example</h1>

    <h3>Median after-tax income, Canadian provinces, 2018.</h3>

    <svg width="600" height="300">
        <g transform="translate(40,20)">
            <g class="x axis" transform="translate(0,210)">
                <text x="10" y="15" transform="translate(31,0)" style="text-anchor: end;">BC</text>
                <text x="10" y="15" transform="translate(84,0)" style="text-anchor: end;">AB</text>
                <text x="10" y="15" transform="translate(137,0)" style="text-anchor: end;">SK</text>

                <text x="10" y="15" transform="translate(349,0)" style="text-anchor: end;">NB</text>
                <text x="10" y="15" transform="translate(402,0)" style="text-anchor: end;">NS</text>
                <text x="10" y="15" transform="translate(455,0)" style="text-anchor: end;">PE</text>
                <text x="10" y="15" transform="translate(508,0)" style="text-anchor: end;">NL</text>

            <g class="y axis">
                <text transform="translate(0,210)" dy=".32em" x="-9" y="0" style="text-anchor: end;">0</text>

                <text transform="translate(0,5.836)" dy=".32em" x="-9" y="0" style="text-anchor: end;">70</text>
                <path class="domain" d="M-6,0H0V210H-6"></path>
                <text x="20" y="6" style="text-anchor: end;">($)</text>
            </g>
            <rect x="6" width="50" y="43.750" height="166.25" style="fill: steelblue;"></rect>
